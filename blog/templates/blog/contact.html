{% extends 'blog\base.html' %}
{% load static %}
{% block content %}
    <div class="col-sm-10">
        <h3 class="text-white my-5">
            Contact Page
        </h3>

        <form>
            <div class="form-row">
                <div class="form-group">
                    <label for="inputName">Name</label>
                    <input type="text" class="form-control mb-3" id="inputName">
                </div>
                <div class="form-group">
                    <label for="inputEmail">Email</label>
                    <input type="email" class="form-control mb-3" id="inputEmail">
                </div>
            </div>
                <div class="form-group">
                    <label for="inputAddress">Address</label>
                    <input type="text" class="form-control mb-3" id="inputAddress">
                </div>
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea class="form-control mb-3" id="message" rows="3"></textarea>
                </div>
                <button type="button" class="btn btn-primary my-2">Send</button>
            
        </form>
        
    </div>
{% endblock content %}
